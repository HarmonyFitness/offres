<script>
  // Thème + phase posés avant le premier rendu (pas de flash de contenu).
  // ?now=2026-10-29T10:00:00%2B01:00 permet de prévisualiser une autre date.
  (function () {
    var C = window.OFFRE, root = document.documentElement;
    var ov = new URLSearchParams(location.search).get('now');
    var now = ov && !isNaN(Date.parse(ov)) ? Date.parse(ov) : Date.now();
    window.OFFRE_OFFSET = now - Date.now();
    root.setAttribute('data-theme', C.theme);
    root.classList.add(now > Date.parse(C.dates.fin) ? 'phase-termine'
      : now >= Date.parse(C.dates.ouverturePublique) ? 'phase-public' : 'phase-avant');
  })();
</script>

<style>
/* =========================================================
   Eliptik Harmony
   ========================================================= */
@font-face {
  font-family: 'Eliptik Harmony';
  src: url('/fonts/Eliptik-Harmony-Regular.ttf') format('truetype');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Eliptik Harmony';
  src: url('/fonts/Eliptik-Harmony-Bold.ttf') format('truetype');
  font-weight: 700; font-style: normal; font-display: swap;
}

/* =========================================================
   DESIGN TOKENS
   ========================================================= */
:root {
  --brand:      #204D6E;
  --brand-600:  #1b4360;
  --brand-700:  #163a54;
  --brand-ink:  #12324a;
  --brand-deep: #0b2131;
  --brand-300:  #8fb2c9;
  --brand-200:  #c6d8e5;
  --brand-100:  #e2ecf3;
  --brand-50:   #f2f7fa;

  --cta:        #005780;
  --cta-hover:  #00466a;

  --ink:   #0a1820;
  --ink-2: #2a3a44;
  --ink-3: #556772;
  --ink-4: #8a99a3;
  --ink-5: #b9c4cb;

  --line:   #e6e9ec;
  --line-2: #f1f3f5;
  --canvas: #ffffff;
  --soft-blue: #eff5f9;

  --green: #22c55e;

  --font-sans:    "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:    "Geist Mono", ui-monospace, "SF Mono", monospace;
  --font-display: 'Eliptik Harmony', "Geist", system-ui, sans-serif;

  --grad-premium: linear-gradient(150deg, #204D6E 0%, #163a54 55%, #0b2131 100%);
  --hero-fallback: radial-gradient(120% 90% at 85% 15%, #1d3a50 0%, #0b1a26 55%, #060f17 100%);

  /* Accent saisonnier · piloté par data-theme */
  --accent:      #204D6E;
  --accent-soft: rgba(32,77,110,.18);

  /* Verre dépoli partagé : header + bouton fixé en bas (mobile) */
  --glass-bg: linear-gradient(135deg, rgba(255,255,255,.58) 0%, rgba(255,255,255,.34) 100%);
  --glass-filter: blur(20px) saturate(190%) brightness(1.06);
  --glass-border: 1px solid rgba(255,255,255,.55);
  --glass-shadow: inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(255,255,255,.18), 0 12px 32px -10px rgba(10,37,64,.32);

  --banner-h: 0px;
  --sticky-h: 0px;
}
/* Habillage Halloween : un seul accent orange, utilisé avec parcimonie */
:root[data-theme="halloween"] {
  --accent:      #F07A2A;
  --accent-soft: rgba(240,122,42,.18);
  --hero-fallback: radial-gradient(120% 90% at 85% 15%, #2a2a3a 0%, #121620 55%, #07090e 100%);
}
/* Habillage Black Friday : accent or sur fond noir */
:root[data-theme="blackfriday"] {
  --accent:      #D9B44A;
  --accent-soft: rgba(217,180,74,.18);
  --hero-fallback: radial-gradient(120% 90% at 85% 15%, #22252b 0%, #0d0f12 55%, #050607 100%);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(100px + var(--banner-h)); }
html, body { margin: 0; padding: 0; background: var(--canvas); }
body {
  font-family: var(--font-sans);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-size: 16px;
  letter-spacing: -0.005em;
  padding-bottom: var(--sticky-h);
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
img { display: block; max-width: 100%; }

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.05;
  color: var(--ink);
  margin: 0;
  text-transform: uppercase;
}

.shell { max-width: 1360px; margin: 0 auto; padding: 0 40px; }
@media (max-width: 900px) { .shell { padding: 0 20px; } }

.todo { background: #fff3a8; color: #6b5200; padding: 0 4px; border-radius: 4px; font-weight: 600; }

/* Visibilité par phase */
.phase-avant   .only-public,  .phase-termine .only-public,
.phase-public  .only-avant,   .phase-termine .only-avant,
.phase-avant   .only-termine, .phase-public  .only-termine,
.phase-termine .hide-termine { display: none !important; }

.arrow-ico { display: inline-flex; align-items: center; transition: transform .2s; }

/* =========================================================
   BANDEAU
   ========================================================= */
.phase-public { --banner-h: 38px; }
.banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  height: var(--banner-h);
  display: flex; align-items: center; justify-content: center;
  padding: 0 16px;
  background: var(--brand-deep);
  color: #fff;
  font-size: 14px; font-weight: 600; letter-spacing: .01em;
  text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.banner::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 10px var(--accent);
  margin-right: 10px; flex-shrink: 0;
  animation: pulseBlink 1.6s ease-in-out infinite;
}
@keyframes pulseBlink { 0%,100%{opacity:1} 50%{opacity:.35} }
@media (max-width: 420px) { .banner { font-size: 13px; } }

/* =========================================================
   TOPBAR · pill flottant
   ========================================================= */
.topbar {
  position: fixed;
  top: calc(21px + var(--banner-h));
  left: 50%; transform: translateX(-50%);
  width: 500px;
  max-width: calc(100% - 32px);
  z-index: 50;
  background: var(--glass-bg);
  backdrop-filter: var(--glass-filter);
  -webkit-backdrop-filter: var(--glass-filter);
  border: var(--glass-border);
  border-radius: 999px;
  box-shadow: var(--glass-shadow);
  transition: width 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
}
.topbar-inner {
  display: flex; align-items: center; justify-content: space-between;
  height: 52px; gap: 16px;
  padding: 0 6px 0 16px;
}
.phase-termine .topbar-inner { justify-content: center; padding: 0 16px; }
.topbar-inner > a { flex-shrink: 0; }
.logo-img { height: 28px; width: auto; display: block; }
.btn-topbar {
  padding: 10px 16px; font-size: 14px; font-weight: 600;
  background: var(--brand-50); color: var(--brand-ink);
  border: 1px solid var(--brand-100);
  border-radius: 999px;
  transition: background .18s, border-color .18s, transform .15s;
  white-space: nowrap; flex-shrink: 0;
  display: inline-flex; align-items: center; gap: 8px;
}
.btn-topbar:hover { background: var(--brand-100); border-color: var(--brand-200); transform: translateY(-1px); }
@media (max-width: 380px) {
  .logo-img { height: 24px; }
  .btn-topbar { padding: 9px 12px; font-size: 13px; }
}

/* =========================================================
   EYEBROW
   ========================================================= */
.eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-size: 12.5px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--brand); font-weight: 700;
  margin-bottom: 16px;
}
@media (max-width: 420px) { .eyebrow { font-size: 11.5px; letter-spacing: .08em; } }

/* =========================================================
   HERO
   ========================================================= */
.hero-wrap {
  padding: 5px;
  height: 100dvh;
  min-height: 720px;
}
@media (max-width: 768px) {
  .hero-wrap { height: auto; min-height: 0; }
}
.hero {
  position: relative;
  height: 100%;
  display: flex; flex-direction: column; justify-content: flex-end;
  overflow: hidden; isolation: isolate;
  color: #fff;
  border-radius: 15px;
  background: var(--hero-fallback);
}
@media (max-width: 768px) {
  .hero { min-height: 640px; padding-top: calc(110px + var(--banner-h)); }
}
.hero-bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: 50% 30%;
  z-index: -2;
  will-change: transform;
}
.has-hero-img .hero::before {
  content: '';
  position: absolute; inset: 0;
  background:
    linear-gradient(to right, rgba(8,18,30,.88) 0%, rgba(8,18,30,.72) 32%, rgba(8,18,30,.2) 62%, transparent 82%),
    linear-gradient(to top, rgba(8,18,30,.55) 0%, transparent 50%);
  z-index: -1;
}
@media (max-width: 900px) {
  .has-hero-img .hero::before {
    background: linear-gradient(to bottom, rgba(8,18,30,.4) 0%, rgba(8,18,30,.75) 50%, rgba(8,18,30,.94) 100%);
  }
}
/* Fond sombre en attendant le visuel */
.hero::after {
  content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(50% 45% at 82% 22%, var(--accent-soft) 0%, transparent 70%);
}
.has-hero-img .hero::after { display: none; }
.hero-placeholder {
  position: absolute; top: calc(92px + var(--banner-h)); right: 28px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: rgba(255,255,255,.35);
  border: 1px dashed rgba(255,255,255,.22); border-radius: 999px;
  padding: 6px 12px;
}
.has-hero-img .hero-placeholder { display: none; }
@media (max-width: 768px) { .hero-placeholder { top: auto; bottom: 16px; right: 16px; } }

.hero-inner {
  display: flex; flex-direction: column; align-items: flex-start;
  padding: 0 72px 84px;
  max-width: 860px; width: 100%;
}
@media (max-width: 900px) { .hero-inner { padding: 0 28px 64px; max-width: 100%; } }
@media (max-width: 600px) { .hero-inner { padding: 0 20px 56px; } }

.hero .eyebrow { color: rgba(255,255,255,.82); }
.hero h1 { color: #fff; margin: 0; }
.hero h1 .h1-l1 {
  display: block;
  font-size: clamp(30px, 3.4vw, 50px);
  line-height: 1; letter-spacing: -0.03em;
}
.hero h1 .h1-price {
  display: block;
  margin-top: 10px;
  font-size: clamp(64px, 8.5vw, 120px);
  line-height: .9; letter-spacing: -0.045em;
  white-space: nowrap;
}
.hero-sub {
  margin: 22px 0 0;
  font-size: clamp(17px, 1.25vw, 19px);
  line-height: 1.55;
  color: rgba(255,255,255,.84);
  max-width: 46ch;
  font-weight: 500;
}
.hero-cta {
  margin-top: 34px;
  display: inline-flex; align-items: center; gap: 12px;
  padding: 17px 30px;
  background: #fff; color: var(--brand-ink);
  border-radius: 999px;
  font-size: 16.5px; font-weight: 700;
  box-shadow: 0 8px 28px rgba(0,0,0,.22);
  transition: transform .18s, background .18s;
}
.hero-cta:hover { background: var(--brand-100); transform: translateY(-1px); }
.hero-cta:hover .arrow-ico { transform: translateX(3px); }
@media (max-width: 600px) { .hero-cta { width: 100%; justify-content: space-between; } }

/* Encart récap des formules (desktop) · verre dépoli */
.hero-recap {
  position: absolute; right: 56px; bottom: 84px;
  width: 340px;
  padding: 20px 20px 12px;
  border-radius: 20px;
  background: rgba(255,255,255,.07);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid rgba(255,255,255,.12);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 20px 40px -20px rgba(0,0,0,.5);
}
.recap-title {
  display: block; margin-bottom: 8px;
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700;
  color: rgba(255,255,255,.6);
}
.recap-row {
  display: grid; grid-template-columns: 1fr auto 18px; align-items: center; gap: 12px;
  padding: 14px 0;
  border-top: 1px solid rgba(255,255,255,.1);
  color: #fff;
}
.recap-row:first-of-type { border-top: 0; }
.recap-name { font-family: var(--font-display); font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: -0.01em; }
.recap-val { font-size: 15px; font-weight: 500; color: rgba(255,255,255,.75); }
.recap-row:hover .arrow-ico { transform: translateX(3px); }
@media (max-width: 1100px) { .hero-recap { display: none; } }

/* Compte à rebours */
.countdown {
  margin-top: 26px;
  display: flex; flex-direction: column; gap: 10px;
}
.countdown-label {
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  font-weight: 700; color: rgba(255,255,255,.72);
  display: inline-flex; align-items: center; gap: 8px;
}
.countdown-label::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 10px var(--accent);
  animation: pulseBlink 1.4s ease-in-out infinite;
}
.countdown-units { display: flex; gap: 8px; }
.cd-unit {
  min-width: 74px; padding: 10px 6px 8px;
  border-radius: 12px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.14);
  text-align: center;
}
.cd-unit b {
  display: block;
  font-family: var(--font-display); font-size: 28px; font-weight: 700;
  line-height: 1; font-variant-numeric: tabular-nums;
}
.cd-unit span {
  display: block; margin-top: 5px;
  font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
  color: rgba(255,255,255,.62); font-weight: 600;
}
@media (max-width: 420px) {
  .countdown { width: 100%; }
  .countdown-units { width: 100%; }
  .cd-unit { min-width: 0; flex: 1; }
  .cd-unit span { letter-spacing: .02em; }
}

/* Bloc « offre terminée » */
.ended-box {
  margin-top: 30px;
  padding: 18px 22px;
  border-radius: 16px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.16);
  max-width: 46ch;
}
.ended-box strong { display: block; font-size: 18px; margin-bottom: 4px; }
.ended-box p { margin: 0; font-size: 16px; line-height: 1.5; color: rgba(255,255,255,.8); }
.ended-box a { text-decoration: underline; text-underline-offset: 3px; }

/* =========================================================
   SECTION HEADS
   ========================================================= */
.section-head {
  display: grid; grid-template-columns: 1fr auto;
  align-items: end; gap: 40px;
  margin-bottom: 32px; padding-bottom: 24px;
  border-bottom: 1px solid var(--line);
}
.section-title {
  font-size: clamp(28px, 3.6vw, 44px);
  letter-spacing: -0.028em; line-height: 1;
}
.section-sub {
  color: var(--ink-3);
  font-size: 16px; line-height: 1.5;
  max-width: 380px; text-align: right; margin: 0;
}
@media (max-width: 900px) {
  .section-head { grid-template-columns: 1fr; gap: 12px; }
  .section-sub { text-align: left; }
}

/* =========================================================
   BÉNÉFICES · 3 colonnes ouvertes (sans cartes), numérotées
   ========================================================= */
.why-section { padding-top: 80px; padding-bottom: 24px; }
.why-section .section-head { border-bottom: 0; padding-bottom: 0; }
.why-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 48px; counter-reset: why; }
.why-item { padding-top: 22px; border-top: 2px solid var(--ink); counter-increment: why; }
.why-item::before {
  content: counter(why, decimal-leading-zero);
  display: block; margin-bottom: 18px;
  font-family: var(--font-mono); font-size: 13px; font-weight: 500; letter-spacing: .08em;
  color: var(--accent);
}
.why-item h3 { font-size: 24px; letter-spacing: -0.015em; line-height: 1.1; margin-bottom: 10px; max-width: 20ch; }
.why-item p { margin: 0; font-size: 16.5px; line-height: 1.6; color: var(--ink-3); max-width: 38ch; }
@media (max-width: 900px) {
  .why-grid { grid-template-columns: 1fr; gap: 28px; }
  .why-item { display: grid; grid-template-columns: 40px 1fr; padding-top: 18px; border-top-width: 1px; border-color: var(--line); }
  .why-item::before { grid-row: span 2; margin: 3px 0 0; }
  .why-item h3 { font-size: 21px; max-width: none; }
}

/* =========================================================
   CARTES FORMULES
   ========================================================= */
.plans-wrap { padding-top: 72px; padding-bottom: 48px; }
.plans {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 32px; align-items: stretch;
}
@media (max-width: 900px) { .plans { grid-template-columns: 1fr; gap: 20px; } }

.plan {
  background: var(--soft-blue);
  border: 1px solid var(--brand-100);
  border-radius: 24px;
  padding: 32px 30px 30px;
  display: flex; flex-direction: column;
  position: relative;
}
@media (max-width: 600px) { .plan { padding: 26px 20px 22px; } }
.plan.featured {
  background: #fff;
  border: 2px solid var(--brand);
  box-shadow: 0 20px 48px -16px rgba(32,77,110,.35);
}
.plan-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
.plan-name {
  font-family: var(--font-display); font-weight: 700;
  font-size: 38px; letter-spacing: -0.03em; line-height: 1;
  text-transform: uppercase;
  margin: 0;
}
@media (max-width: 600px) { .plan-name { font-size: 32px; } }
.plan-badge {
  flex-shrink: 0;
  font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  padding: 6px 11px; border-radius: 999px;
  background: var(--accent); color: #fff;
}

/* Durée + accès : les deux chiffres clés de la formule, côte à côte */
.plan-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.fact {
  position: relative;
  padding: 14px 16px 16px;
  border-radius: 14px;
  background: #fff;
  border: 1px solid rgba(10,37,64,.08);
}
.plan.featured .fact { background: var(--brand-50); border-color: var(--brand-100); }
.fact-label {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  min-height: 24px;
  font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-4);
}
.fact-val {
  display: block; margin-top: 6px;
  font-family: var(--font-display); font-weight: 700;
  font-size: 40px; line-height: 1; letter-spacing: -0.03em;
  color: var(--brand-ink);
}
.fact-val small { font-size: 18px; letter-spacing: -0.01em; margin-left: 4px; }
@media (max-width: 380px) { .fact-val { font-size: 34px; } .fact { padding: 12px 12px 14px; } }
.info-btn {
  width: 24px; height: 24px; border-radius: 50%;
  display: inline-grid; place-items: center;
  background: var(--brand-100); color: var(--brand-ink);
  font-family: var(--font-mono); font-size: 13px; font-weight: 600;
  transition: background .15s;
}
.info-btn:hover, .info-btn[aria-expanded="true"] { background: var(--brand); color: #fff; }
.clubs-pop {
  position: absolute; left: 0; top: calc(100% + 10px); z-index: 20;
  width: min(320px, calc(100vw - 72px));
  padding: 16px 18px;
  background: #fff; color: var(--ink);
  border-radius: 14px;
  box-shadow: 0 16px 40px rgba(10,37,64,.22), 0 0 0 1px rgba(10,37,64,.06);
  font-weight: 400;
  opacity: 0; visibility: hidden; transform: translateY(-4px);
  transition: opacity .15s, transform .15s, visibility .15s;
}
.fact-clubs .clubs-pop { left: auto; right: 0; }
.clubs-pop.is-open { opacity: 1; visibility: visible; transform: none; }
@media (hover: hover) and (pointer: fine) {

.features-list {

.feat-icon {
  flex: 0 0 20px; width: 20px; height: 20px;

.feat-val { font-size: 14.5px; font-weight: 600; text-align: right; }

.feat .tag {
  margin-left: 6px; vertical-align: 1px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 999px;

}

/* =========================================================
   COURS COLLECTIFS · par objectif + Small Group Training (Extra)
   ========================================================= */
.cours-section { padding-top: 72px; padding-bottom: 24px; }
.cours-legend { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 24px; margin: -8px 0 16px; font-size: 15px; color: var(--ink-3); }

.cours-groups { border-top: 2px solid var(--ink); }
.cours-group {

  padding: 20px 0; border-bottom: 1px solid var(--line);
}
.cours-group h3 { font-size: 20px; letter-spacing: -0.01em; line-height: 1.15; }

.cours-chip {

.cours-chip.more { background: transparent; border-style: dashed; color: var(--ink-4); font-weight: 500; }
.cours-note { margin: 18px 0 0; font-size: 15px; color: var(--ink-3); }
@media (max-width: 760px) {
  .cours-group { grid-template-columns: 1fr; gap: 12px; padding: 18px 0; }
  .cours-group h3 { font-size: 18px; }

/* SGT : visuellement à part, sans coche ni fond « inclus » */
.sgt-box {
  margin-top: 32px;
  display: grid; grid-template-columns: minmax(220px, 1fr) 2.2fr; gap: 24px; align-items: start;
  padding: 24px 26px;

}

.sgt-badge {

/* =========================================================

.clubs-layout { display: grid; grid-template-columns: 1fr 1.15fr; gap: 56px; align-items: start; }

.club-tag {

  font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 999px;

}
.club-tag.premium { background: var(--accent); color: #fff; }

.canton + .canton { margin-top: 26px; }
.canton h3 {
  font-family: var(--font-sans); text-transform: uppercase;
  font-size: 12px; letter-spacing: .12em; font-weight: 700;
  color: var(--ink-4); margin-bottom: 6px;
}
.club-rows { list-style: none; margin: 0; padding: 0; }
.club-row {
  display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 14px;
  padding: 13px 10px; margin: 0 -10px;

}

  width: 26px; height: 26px; border-radius: 50%;

.club-row.is-active { background: var(--brand-100); }

/* Carte */
.clubs-map {
  position: sticky; top: calc(96px + var(--banner-h));
  margin: 0;
  border-radius: 24px;
  background: var(--brand-50);
  border: 1px solid var(--brand-100);
  overflow: hidden;
}
.clubs-map svg { display: block; width: 100%; height: auto; }
.map-label {
  font-family: var(--font-sans); font-size: 7px; font-weight: 700;

}
.map-label.lake { fill: var(--brand-300); font-size: 9px; letter-spacing: .3em; }

.pin.premium circle { fill: var(--accent); }
.pin text {
  font-family: var(--font-mono); font-size: 8px; font-weight: 600;
  fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none;

.pin { cursor: default; }
.pin.is-active circle { transform: scale(1.6); stroke-width: 1.5; filter: drop-shadow(0 2px 4px rgba(10,37,64,.35)); }
.clubs-map figcaption {
  padding: 12px 18px; border-top: 1px solid var(--brand-100);
  font-size: 12.5px; color: var(--ink-4);
}
@media (max-width: 900px) { .clubs-map { position: static; } }

/* =========================================================
   GALERIE · ce qui vous attend dans les clubs
   ========================================================= */
.gallery-section { padding-top: 72px; padding-bottom: 24px; }
.gallery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.gallery-item {
  position: relative; aspect-ratio: 3/4;
  border-radius: 20px; overflow: hidden;
  background: var(--soft-blue);
}
.gallery-item img {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
  transition: transform .6s cubic-bezier(.16, 1, .3, 1);
}
.gallery-item:hover img { transform: scale(1.04); }
.gallery-item::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(10,37,64,0) 45%, rgba(10,37,64,.78) 100%);
}
.gallery-cap { position: absolute; left: 22px; right: 22px; bottom: 22px; color: #fff; z-index: 2; }
.gallery-lbl {
  margin: 0 0 4px;
  font-family: var(--font-display); font-size: 22px; font-weight: 700;
  letter-spacing: -0.01em; line-height: 1.15; text-transform: uppercase;
}
.gallery-title { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.5; opacity: .85; }
.gallery-pin {
  position: absolute; top: 16px; left: 16px; z-index: 3;
  background: var(--brand); color: #fff;

  font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;

@media (max-width: 900px) { .gallery-grid { grid-template-columns: 1fr 1fr; gap: 12px; } }
@media (max-width: 600px) {

  .gallery-cap { left: 14px; right: 14px; bottom: 14px; }
  .gallery-lbl { font-size: 18px; }
  .gallery-title { font-size: 13.5px; }
  .gallery-pin { top: 10px; left: 10px; font-size: 10.5px; padding: 5px 9px; }
}

/* =========================================================
   FAQ
   ========================================================= */
.faq-section { padding: 64px 0 80px; background: var(--soft-blue); }
.faq-section .section-head { border-color: var(--brand-100); }
.faq-section .section-sub a { color: var(--brand); text-decoration: underline; text-underline-offset: 3px; }
.faq-list { max-width: 820px; margin: 0 auto; border-top: 1px solid var(--brand-100); }
.faq-item { border-bottom: 1px solid var(--brand-100); }
.faq-q {
  width: 100%; padding: 22px 4px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 24px; text-align: left;
  font-size: 17.5px; font-weight: 600;
  color: var(--ink); letter-spacing: -0.01em;
  transition: color .18s;
}

.faq-icon {
  flex-shrink: 0; width: 28px; height: 28px; border-radius: 999px;

  transition: background .18s, color .18s;
}

.faq-a p { margin: 0; padding: 0 4px 22px; font-size: 16.5px; color: var(--ink-3); line-height: 1.65; max-width: 64ch; }

/* =========================================================
   CTA FINAL
   ========================================================= */
.closing {
  position: relative; padding: 96px 0;
  overflow: hidden; isolation: isolate; color: #fff;
  background: var(--grad-premium);
}
.closing::before {
  content: ''; position: absolute; inset: 0; z-index: -1;
  background: radial-gradient(45% 60% at 50% 0%, var(--accent-soft) 0%, transparent 70%);
}
.closing-inner { max-width: 760px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; align-items: center; }
.closing h2 { font-size: clamp(32px, 4.4vw, 54px); letter-spacing: -0.03em; color: #fff; margin-bottom: 20px; }
.closing-lead { font-size: 18.5px; color: rgba(255,255,255,.85); line-height: 1.6; margin: 0 0 30px; }
.closing .hero-cta { margin-top: 0; }
.closing .countdown { align-items: center; margin-top: 28px; }
.closing .ended-box { margin-top: 0; text-align: center; }
@media (max-width: 600px) { .closing { padding: 72px 0; } }

/* =========================================================
   FOOTER · mentions légales + contact
   ========================================================= */
.foot { padding: 40px 0 36px; background: var(--ink); color: rgba(255,255,255,.6); font-size: 14px; }
.foot-inner { display: flex; flex-direction: column; gap: 18px; }
.foot-mentions { margin: 0; line-height: 1.6; max-width: 80ch; }
.foot-mentions a { color: #fff; text-decoration: underline; text-underline-offset: 3px; }
.foot-links { display: flex; flex-wrap: wrap; gap: 8px 22px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.1); }
.foot-links a { color: rgba(255,255,255,.85); }
.foot-links a:hover { color: #fff; }
.foot-links .copy { margin-left: auto; color: rgba(255,255,255,.4); }
@media (max-width: 600px) { .foot-links .copy { margin-left: 0; width: 100%; } }

/* =========================================================
   CTA STICKY MOBILE
   ========================================================= */
.sticky-cta { display: none; }
@media (max-width: 900px) {
  .sticky-cta {
    display: block;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 55;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    background: transparent;
    pointer-events: none;
    transform: translateY(130%);
    transition: transform .3s cubic-bezier(.16,1,.3,1);
  }
  .sticky-cta.is-visible { transform: none; }
  .sticky-cta a {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px; border-radius: 999px;

    backdrop-filter: var(--glass-filter);
    -webkit-backdrop-filter: var(--glass-filter);
    border: var(--glass-border);

    color: var(--brand-ink);

  }
  .sticky-cta small { display: block; text-align: center; font-size: 11.5px; color: var(--ink-3); margin-top: 6px; font-weight: 500; }

/* Retour tactile au clic */
.plan-cta:active, .hero-cta:active, .btn-topbar:active, .sticky-cta a:active, .recap-row:active { transform: scale(.98); }

/* Reveal */
.reveal { opacity: 0; transform: translateY(20px); transition: opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1); }
.reveal.is-in { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .reveal { opacity: 1; transform: none; }
}

  var ICO = {
    arrow: '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true"><path d="M3 8 H13 M9 4 L13 8 L9 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    check: '<svg viewBox="0 0 14 14" width="12" height="12" fill="none" aria-hidden="true"><path d="M2.5 7.5 L5.5 10.5 L11.5 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    dash:  '<svg viewBox="0 0 14 14" width="12" height="12" fill="none" aria-hidden="true"><path d="M3 7 L11 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    plus:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>'
  };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }
  // Typo française (espaces insécables) + surlignage des contenus en attente
  function txt(s) {
    var out = esc(s)
      .replace(/ ([:;?!»])/g, ' $1')
      .replace(/CHF /g, 'CHF ')
      .replace(/(\d+)x /g, '$1x ');
    return out.replace(/\[À [^\]]+\]/g, function (m) { return '<span class="todo">' + m + '</span>'; });
  }
  function get(path) {
    return path.split('.').reduce(function (o, k) { return o == null ? o : o[k]; }, C);
  }
  function el(id) { return document.getElementById(id); }

  /* ---------- UTM : transmis aux liens d'achat ---------- */
  var UTM_KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'];
  var utm = {};
  (function () {
    var p = new URLSearchParams(location.search);
    UTM_KEYS.forEach(function (k) { var v = p.get(k); if (v) utm[k] = v; });
    var KEY = 'offre_' + C.slug + '_utm';
    try {
      if (Object.keys(utm).length) sessionStorage.setItem(KEY, JSON.stringify(utm));
      else utm = JSON.parse(sessionStorage.getItem(KEY) || '{}') || {};
    } catch (e) { /* stockage indisponible : on garde les UTM de l'URL */ }
  })();
  function buyUrl(f) {
    var url = C.checkoutUrl + encodeURIComponent(f.produitId);
    UTM_KEYS.forEach(function (k) { if (utm[k]) url += '&' + k + '=' + encodeURIComponent(utm[k]); });
    return url;
  }
  function buyCta(f, position, cls) {
    return '<a class="' + (cls || 'plan-cta') + ' hide-termine" href="' + esc(buyUrl(f)) + '" target="_blank" rel="noopener"' +
      ' data-formule="' + esc(f.id) + '" data-position="' + esc(position) + '">' +
      '<span>' + txt(f.cta) + '</span><span class="arrow-ico">' + ICO.arrow + '</span></a>';
  }

  /* ---------- Clubs ---------- */
  var CANTONS = ['Genève', 'Vaud'];
  function clubsFor(cats) { return C.clubs.filter(function (c) { return cats.indexOf(c.categorie) !== -1; }); }
  function byCanton(list) {
    return CANTONS.map(function (ct) {
      return { canton: ct, clubs: list.filter(function (c) { return c.canton === ct; }) };
    }).filter(function (g) { return g.clubs.length; });
  }

  /* ---------- Textes simples ---------- */
  document.querySelectorAll('[data-t]').forEach(function (n) {
    var v = get(n.getAttribute('data-t'));
    if (v != null) n.innerHTML = txt(v);
  });
  document.querySelectorAll('[data-ico]').forEach(function (n) { n.innerHTML = ICO[n.getAttribute('data-ico')]; });

  /* ---------- Hero visuel ---------- */
  if (C.visuels.hero) {
    root.classList.add('has-hero-img');
    var bg = document.querySelector('.hero-bg');
    bg.style.backgroundImage = 'url("' + C.visuels.hero.replace(/"/g, '%22') + '")';
    bg.setAttribute('aria-label', C.nom);
  }

  /* ---------- Encart récap du hero ---------- */
  el('hero-recap').innerHTML = '<span class="recap-title">' + txt(C.hero.recapTitre) + '</span>' +
    C.formules.map(function (f) {
      return '<a class="recap-row" href="#formule-' + esc(f.id) + '">' +
        '<span class="recap-name">' + txt(f.titre) + '</span>' +
        '<span class="recap-val">' + txt(f.resume) + '</span>' +
        '<span class="arrow-ico">' + ICO.arrow + '</span></a>';
    }).join('');

  /* ---------- Pourquoi ---------- */
  el('why-grid').innerHTML = C.pourquoi.blocs.map(function (b) {
    return '<div class="why-item"><h3>' + txt(b.titre) + '</h3><p>' + txt(b.texte) + '</p></div>';
  }).join('');

  /* ---------- Cartes formules ---------- */
  function ligneVal(v) {
    if (v === true)  return { on: true,  val: 'Inclus' };
    if (v === false || v == null) return { on: false, val: 'Non inclus' };
    return { on: true, val: v };
  }
  el('formules').innerHTML = C.formules.map(function (f, i) {
    var pop = byCanton(clubsFor(f.categories)).map(function (g) {
      return '<div class="pop-canton"><h4>Canton de ' + esc(g.canton) + '</h4><ul>' +
        g.clubs.map(function (c) { return '<li>' + txt(c.nom) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    // Lignes qui distinguent les formules : mises en avant ; « Premium » sur celles que l'Essential n'a pas
    var lignes = C.lignes.map(function (l) {
      var r = ligneVal(f.inclus[l.cle]);
      var vals = C.formules.map(function (x) { return String(x.inclus[l.cle]); });
      var diff = vals.some(function (v) { return v !== vals[0]; });
      var exclusive = r.on && C.formules.some(function (x) { return !ligneVal(x.inclus[l.cle]).on; });
      return '<li class="feat' + (r.on ? '' : ' off') + (diff && r.on ? ' diff' : '') + '">' +
        '<span class="feat-icon">' + (r.on ? ICO.check : ICO.dash) + '</span>' +
        '<span class="feat-label">' + txt(l.label) + (exclusive ? ' <span class="tag">' + txt(C.tagDiff) + '</span>' : '') + '</span>' +
        '<span class="feat-val">' + txt(r.val) + '</span></li>';
    }).join('');
    var popId = 'clubs-pop-' + f.id;
    var nbClubs = clubsFor(f.categories).length;
    return '<article class="plan reveal' + (f.badge ? ' featured' : '') + '" data-id="' + esc(f.id) + '" id="formule-' + esc(f.id) + '">' +
      '<div class="plan-top"><h3 class="plan-name">' + txt(f.titre) + '</h3>' +
        (f.badge ? '<span class="plan-badge">' + txt(f.badge) + '</span>' : '') + '</div>' +
      '<p class="plan-tagline">' + txt(f.accroche) + '</p>' +
      '<div class="plan-facts">' +
        '<div class="fact"><span class="fact-label">Durée</span>' +
          '<span class="fact-val">' + txt(f.duree).replace(/^(\d+)\s*(.*)$/, '$1<small>$2</small>') + '</span></div>' +
        '<div class="fact fact-clubs"><span class="fact-label">Accès' +
          '<button type="button" class="info-btn" aria-expanded="false" aria-controls="' + popId + '" aria-label="Voir la liste des clubs">i</button></span>' +
          '<span class="fact-val">' + nbClubs + '<small>clubs</small></span>' +
          '<div class="clubs-pop" id="' + popId + '" role="tooltip">' + pop + '</div></div>' +
      '</div>' +
      '<ul class="features-list">' + lignes + '</ul>' +
      '<div class="plan-price-block">' +
        '<div class="plan-price"><span class="amount">' + txt(f.prix) + '</span><span class="per">pour ' + txt(f.duree) + '</span></div>' +
        '<div class="price-meta">' + txt(f.sousPrix) + '</div>' +
        buyCta(f, 'carte') +
        '<p class="plan-reassure hide-termine">' + txt(C.reassurance) + '</p>' +
        '<div class="plan-ended only-termine">' + txt(C.termine.titre) + '</div>' +
      '</div>' +
    '</article>';
  }).join('');

  /* ---------- Galerie ---------- */
  el('gallery').innerHTML = C.galerie.items.map(function (g) {
    return '<div class="gallery-item">' +
      (g.badge ? '<span class="gallery-pin">' + txt(g.badge) + '</span>' : '') +
      '<img src="' + esc(g.image) + '" alt="' + esc(g.alt) + '" loading="lazy" decoding="async">' +
      '<div class="gallery-cap"><p class="gallery-lbl">' + txt(g.titre) + '</p><p class="gallery-title">' + txt(g.texte) + '</p></div></div>';
  }).join('');

  /* ---------- Cours collectifs ---------- */
  (function () {
    var K = C.coursSection;
    var tagP = '<span class="club-tag premium">Premium</span>';
    el('cours').innerHTML =
      '<div class="cours-legend"><span class="cours-kicker">' + txt(K.kicker) + '</span>' +
        '<span class="cours-legend-p">' + tagP + txt(K.legendePremium) + '</span></div>' +
      '<div class="cours-groups">' + K.groupes.map(function (g) {
        return '<div class="cours-group"><h3>' + txt(g.objectif) + '</h3><ul class="cours-list">' +
          g.cours.map(function (c) { return '<li class="cours-chip">' + txt(c.nom) + (c.premium ? tagP : '') + '</li>'; }).join('') +
          '<li class="cours-chip more">' + txt(K.plusLabel) + '…</li></ul></div>';
      }).join('') + '</div>' +
      '<p class="cours-note">' + txt(K.note) + '</p>' +
      '<div class="sgt-box"><div class="sgt-head"><h3>' + txt(K.sgt.titre) + '</h3><span class="sgt-badge">' + txt(K.sgt.badge) + '</span></div>' +
        '<div class="sgt-body"><p>' + txt(K.sgt.texte) + '</p><ul class="cours-list">' +
          K.sgt.cours.map(function (n) { return '<li class="sgt-chip">' + txt(n) + '</li>'; }).join('') +
        '</ul></div></div>';
  })();

  /* ---------- Clubs : liste numérotée + carte ---------- */
  (function () {
    var base = C.formules[0].categories;                 // catégories incluses dans l'Essential
    var groups = byCanton(C.clubs), n = 0;
    groups.forEach(function (g) { g.clubs.forEach(function (c) { c.num = ++n; c.premium = base.indexOf(c.categorie) === -1; }); });
    function tag(premium) {
      return '<span class="club-tag' + (premium ? ' premium' : '') + '">' + (premium ? 'Premium' : 'Essential') + '</span>';
    }

    el('clubs-list').innerHTML =
      '<ul class="clubs-legend">' +
        '<li>' + tag(false) + txt(C.clubsSection.legendeEssential) + '</li>' +
        '<li>' + tag(true) + txt(C.clubsSection.legendePremium) + '</li>' +
      '</ul>' +
      groups.map(function (g) {
        return '<div class="canton"><h3>Canton de ' + esc(g.canton) + '</h3><ol class="club-rows">' +
          g.clubs.map(function (c) {
            return '<li class="club-row' + (c.premium ? ' premium' : '') + '" data-club="' + c.num + '">' +
              '<span class="club-num" aria-hidden="true">' + c.num + '</span>' +
              '<span>' + txt(c.nom) + '</span>' + tag(c.premium) + '</li>';
          }).join('') + '</ol></div>';
      }).join('');

    // Même projection que le script qui a généré images/carte-leman.svg
    var M = C.carte, K = 1000, COS = Math.cos((M.lat0 + M.lat1) / 2 * Math.PI / 180);
    var W = (M.lon1 - M.lon0) * COS * K, H = (M.lat1 - M.lat0) * K;
    function xy(lat, lon) { return [((lon - M.lon0) * COS * K).toFixed(1), ((M.lat1 - lat) * K).toFixed(1)]; }
    var svg = '<svg viewBox="0 0 ' + W.toFixed(1) + ' ' + H.toFixed(1) + '" role="img" aria-label="Carte des 10 clubs Harmony autour du Léman">' +
      '<image href="' + esc(M.image) + '" x="0" y="0" width="' + W.toFixed(1) + '" height="' + H.toFixed(1) + '"/>' +
      M.libelles.map(function (l) {
        var p = xy(l.lat, l.lon);
        return '<text class="map-label' + (l.texte === 'Léman' ? ' lake' : '') + '" x="' + p[0] + '" y="' + p[1] + '">' + esc(l.texte) + '</text>';
      }).join('') +
      C.clubs.slice().sort(function (a, b) { return b.lat - a.lat; }).map(function (c) {
        var p = xy(c.lat, c.lon);
        return '<g class="pin' + (c.premium ? ' premium' : '') + '" data-club="' + c.num + '"><title>' + esc(c.nom) + '</title>' +
          '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="8"/><text x="' + p[0] + '" y="' + p[1] + '">' + c.num + '</text></g>';
      }).join('') + '</svg>';
    el('clubs-map').innerHTML = svg + '<figcaption>Emplacements indicatifs · Fond de carte © OpenStreetMap</figcaption>';

    // Survol / toucher : la ligne et le repère s'allument ensemble
    function activate(num) {
      document.querySelectorAll('[data-club]').forEach(function (n) {
        var on = n.getAttribute('data-club') === num;
        n.classList.toggle('is-active', on);
        if (on && n.classList.contains('pin')) n.parentNode.appendChild(n);   // repère actif au premier plan
      });
    }
    var zone = document.querySelector('.clubs-layout');
    zone.addEventListener('mouseover', function (e) {
      var t = e.target.closest && e.target.closest('[data-club]');
      activate(t ? t.getAttribute('data-club') : null);
    });
    zone.addEventListener('mouseleave', function () { activate(null); });
    zone.addEventListener('click', function (e) {
      var t = e.target.closest && e.target.closest('[data-club]');
      if (t) activate(t.getAttribute('data-club'));
    });
  })();

  /* ---------- FAQ ---------- */
  el('faq-contact').innerHTML = 'Une autre question ? Écrivez à <a href="mailto:' + esc(C.liens.contactEmail) + '">' +
    esc(C.liens.contactEmail) + '</a> ou passez à l’accueil de votre club.';
  el('faq').innerHTML = C.faq.map(function (it, i) {
    return '<div class="faq-item"><button class="faq-q" type="button" aria-expanded="false" aria-controls="faq-a-' + i + '">' +
      '<span>' + txt(it.q) + '</span><span class="faq-icon">' + ICO.plus + '</span></button>' +
      '<div class="faq-a" id="faq-a-' + i + '"><p>' + txt(it.r) + '</p></div></div>';
  }).join('');

  /* ---------- Offre terminée ---------- */
  document.querySelectorAll('[data-ended]').forEach(function (n) {
    n.innerHTML = '<strong>' + txt(C.termine.titre) + '</strong><p>' +
      txt(C.termine.texte).replace('harmony.ch', '<a href="' + esc(C.termine.lien) + '">harmony.ch</a>') + '</p>';
  });

  /* ---------- Pied de page ---------- */
  el('mentions').innerHTML = txt(C.mentions) + ' Voir les ' +
    (C.liens.conditions
      ? '<a href="' + esc(C.liens.conditions) + '" target="_blank" rel="noopener">conditions de l’offre</a>.'
      : 'conditions de l’offre <span class="todo">[À CONFIRMER : lien CGV promo]</span>.');
  el('foot-links').innerHTML =
    '<a href="mailto:' + esc(C.liens.contactEmail) + '">Contact : ' + esc(C.liens.contactEmail) + '</a>' +
    '<a href="' + esc(C.liens.mentionsLegales) + '" target="_blank" rel="noopener">Mentions légales</a>' +
    '<a href="' + esc(C.liens.confidentialite) + '" target="_blank" rel="noopener">Politique de confidentialité</a>' +
    '<span class="copy">© ' + new Date(T_FIN).getFullYear() + ' Harmony Fitness</span>';

  /* ---------- Phase + compte à rebours ---------- */
  var CD_UNITS = [['j', 'Jours'], ['h', 'Heures'], ['m', 'Min'], ['s', 'Sec']];
  document.querySelectorAll('[data-countdown]').forEach(function (n) {
    n.innerHTML = '<span class="countdown-label">' + txt(C.compteRebours) + '</span><div class="countdown-units">' +
      CD_UNITS.map(function (u) { return '<div class="cd-unit"><b data-cd="' + u[0] + '">00</b><span>' + u[1] + '</span></div>'; }).join('') + '</div>';
  });
  function phase(t) { return t > T_FIN ? 'termine' : t >= T_PUBLIC ? 'public' : 'avant'; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  var current = null;
  function tick() {
    var t = now(), ph = phase(t);
    if (ph !== current) {
      root.classList.remove('phase-avant', 'phase-public', 'phase-termine');
      root.classList.add('phase-' + ph);
      current = ph;
    }
    if (ph === 'public') {
      var s = Math.max(0, Math.floor((T_FIN - t) / 1000) + 1);
      var v = { j: Math.floor(s / 86400), h: Math.floor(s % 86400 / 3600), m: Math.floor(s % 3600 / 60), s: s % 60 };
      document.querySelectorAll('[data-cd]').forEach(function (b) { b.textContent = pad(v[b.getAttribute('data-cd')]); });
    }
  }
  tick();
  setInterval(tick, 1000);

  /* ---------- Tracking GTM ---------- */
  window.dataLayer = window.dataLayer || [];
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[data-formule]');
    if (!a) return;
    window.dataLayer.push({
      event: C.gtmEvent,
      offre: C.utmCampaign,
      formule: a.getAttribute('data-formule'),
      cta_position: a.getAttribute('data-position')
    });
  });

  /* ---------- Info clubs : survol desktop, toucher mobile ---------- */
  function closePops(except) {
    document.querySelectorAll('.info-btn[aria-expanded="true"]').forEach(function (b) {
      if (b === except) return;
      b.setAttribute('aria-expanded', 'false');
      el(b.getAttribute('aria-controls')).classList.remove('is-open');
    });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.info-btn');
    if (b) {
      var open = b.getAttribute('aria-expanded') === 'true';
      closePops(b);
      b.setAttribute('aria-expanded', open ? 'false' : 'true');
      el(b.getAttribute('aria-controls')).classList.toggle('is-open', !open);
      return;
    }
    if (!(e.target.closest && e.target.closest('.clubs-pop'))) closePops();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePops(); });

  /* ---------- FAQ accordéon ---------- */
  document.querySelectorAll('.faq-q').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var item = btn.closest('.faq-item');
      var open = item.classList.contains('is-open');
      document.querySelectorAll('.faq-item').forEach(function (i) {
        i.classList.remove('is-open');
        i.querySelector('.faq-q').setAttribute('aria-expanded', 'false');
      });
      if (!open) { item.classList.add('is-open'); btn.setAttribute('aria-expanded', 'true'); }
    });
  });

  /* ---------- CTA sticky mobile : après le hero, masqué sur les cartes ---------- */
  (function () {
    var bar = el('sticky-cta'), heroCta = el('hero-cta'), plans = el('formules');
    if (!bar || !('IntersectionObserver' in window)) return;
    var heroVisible = true, plansVisible = false;
    function update() {
      var show = !heroVisible && !plansVisible;
      bar.classList.toggle('is-visible', show);
      root.style.setProperty('--sticky-h', show && innerWidth <= 900 ? bar.offsetHeight + 'px' : '0px');
    }
    new IntersectionObserver(function (en) { heroVisible = en[0].isIntersecting; update(); }).observe(heroCta);
    new IntersectionObserver(function (en) { plansVisible = en[0].isIntersecting; update(); }, { threshold: 0.15 }).observe(plans);
  })();

  /* ---------- Topbar : rétrécit au scroll (desktop) ---------- */
  (function () {
    var topbar = document.querySelector('.topbar'), pending = false;
    function f() {
      pending = false;
      if (innerWidth <= 600) { topbar.style.width = ''; return; }
      var t = Math.min(scrollY / 180, 1), ease = 1 - Math.pow(1 - t, 2);
      topbar.style.width = Math.round(500 - 100 * ease) + 'px';
    }
    addEventListener('scroll', function () { if (!pending) { pending = true; requestAnimationFrame(f); } }, { passive: true });
  })();

  /* ---------- Reveal ---------- */
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
    document.querySelectorAll('.reveal').forEach(function (n) { io.observe(n); });
  } else {
    document.querySelectorAll('.reveal').forEach(function (n) { n.classList.add('is-in'); });
  }
})();
</script>
</body>
</html>
