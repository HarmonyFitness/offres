<style>
/* =========================================================
   Eliptik Harmony (titres) + Geist (texte)
   ========================================================= */
@font-face {
  font-family: 'Eliptik Harmony';
  src: url('/fonts/Eliptik-Harmony-Regular.ttf') format('truetype');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Eliptik Harmony';
  src: url('/fonts/Eliptik-Harmony-Bold.ttf') format('truetype');
  font-weight: 700; font-style: normal; font-display: swap;
}

/* =========================================================
   TOKENS
   Bleu Harmony = structure, bleu CTA = acheter, accent = saison (bandeau,
   compte à rebours, lueur du hero) et rien d'autre.
   ========================================================= */
:root {
  --brand:      #204D6E;
  --brand-ink:  #12324a;
  --brand-deep: #0b2131;
  --brand-300:  #8fb2c9;
  --brand-200:  #c6d8e5;
  --brand-100:  #e2ecf3;
  --brand-50:   #f2f7fa;

  --cta:        #005780;
  --cta-hover:  #00466a;

  --ink:   #14222c;
  --ink-2: #2d3d48;
  --ink-3: #566874;
  --ink-4: #86959f;
  --ink-5: #b9c4cb;

  --line:   #e4e9ed;
  --canvas: #ffffff;
  --soft:   #eef4f8;

  --font-sans:    "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: 'Eliptik Harmony', "Geist", system-ui, sans-serif;

  --hero-fallback: radial-gradient(120% 90% at 85% 15%, #1d3a50 0%, #0b1a26 55%, #060f17 100%);
  --closing-bg: linear-gradient(150deg, #204D6E 0%, #163a54 55%, #0b2131 100%);

  --accent:      #204D6E;
  --accent-soft: rgba(32,77,110,.18);

  /* Verre dépoli partagé : header + bouton fixé en bas (mobile) */
  --glass-bg: linear-gradient(135deg, rgba(255,255,255,.58) 0%, rgba(255,255,255,.34) 100%);
  --glass-filter: blur(20px) saturate(190%) brightness(1.06);
  --glass-border: 1px solid rgba(255,255,255,.55);
  --glass-shadow: inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(255,255,255,.18), 0 12px 32px -10px rgba(10,37,64,.32);

  --banner-h: 0px;
  --sticky-h: 0px;
}
:root[data-theme="halloween"] {
  --accent:      #E8702A;
  --accent-soft: rgba(232,112,42,.20);
  --hero-fallback: radial-gradient(120% 90% at 85% 15%, #2a2a3a 0%, #121620 55%, #080a0f 100%);
}
:root[data-theme="blackfriday"] {
  --accent:      #D9B44A;
  --accent-soft: rgba(217,180,74,.18);
  --hero-fallback: radial-gradient(120% 90% at 85% 15%, #22252b 0%, #0e1013 55%, #07080a 100%);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(100px + var(--banner-h)); }
html, body { margin: 0; padding: 0; background: var(--canvas); }
body {
  font-family: var(--font-sans);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-size: 16px;
  line-height: 1.5;
  padding-bottom: var(--sticky-h);
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--cta); outline-offset: 3px; border-radius: 6px; }

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.08;
  color: var(--ink);
  margin: 0;
  text-transform: uppercase;          /* charte : Eliptik toujours en capitales */
}

.shell { max-width: 1280px; margin: 0 auto; padding: 0 40px; }
@media (max-width: 900px) { .shell { padding: 0 20px; } }

.todo { background: #fff3a8; color: #6b5200; padding: 0 4px; border-radius: 4px; font-weight: 600; }

/* Visibilité par phase */
.phase-avant   .only-public,  .phase-termine .only-public,
.phase-public  .only-avant,   .phase-termine .only-avant,
.phase-avant   .only-termine, .phase-public  .only-termine,
.phase-termine .hide-termine { display: none !important; }

/* Étiquettes de formule : Premium plein, Essential clair */
.tag {
  display: inline-flex; align-items: center; flex-shrink: 0;
  font-size: 12.5px; font-weight: 600; line-height: 1;
  padding: 5px 9px; border-radius: 999px;
  background: var(--brand-100); color: var(--brand-ink);
}
.tag.premium { background: var(--brand); color: #fff; }

/* =========================================================
   BANDEAU (à partir de l'ouverture au grand public)
   ========================================================= */
.phase-public { --banner-h: 38px; }
.banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  height: var(--banner-h);
  display: flex; align-items: center; justify-content: center;
  padding: 0 16px;
  background: var(--brand-deep);
  color: #fff;
  font-size: 14px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.banner::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 10px var(--accent);
  margin-right: 10px; flex-shrink: 0;
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
@media (max-width: 420px) { .banner { font-size: 13px; } }

/* =========================================================
   HEADER · pilule en verre
   ========================================================= */
.topbar {
  position: fixed;
  top: calc(21px + var(--banner-h));
  left: 50%; transform: translateX(-50%);
  width: 500px; max-width: calc(100% - 32px);
  z-index: 50;
  background: var(--glass-bg);
  backdrop-filter: var(--glass-filter);
  -webkit-backdrop-filter: var(--glass-filter);
  border: var(--glass-border);
  border-radius: 999px;
  box-shadow: var(--glass-shadow);
  transition: width 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
}
.topbar-inner {
  display: flex; align-items: center; justify-content: space-between;
  height: 52px; gap: 16px;
  padding: 0 6px 0 16px;
}
.phase-termine .topbar-inner { justify-content: center; padding: 0 16px; }
.topbar-inner > a { flex-shrink: 0; }
.logo-img { height: 28px; width: auto; display: block; }
.btn-topbar {
  padding: 10px 16px; font-size: 14px; font-weight: 600;
  background: var(--brand-50); color: var(--brand-ink);
  border: 1px solid var(--brand-100);
  border-radius: 999px;
  transition: background .18s, border-color .18s;
  white-space: nowrap; flex-shrink: 0;
}
.btn-topbar:hover { background: var(--brand-100); border-color: var(--brand-200); }
@media (max-width: 380px) {
  .logo-img { height: 24px; }
  .btn-topbar { padding: 9px 12px; font-size: 13px; }
}

/* =========================================================
   EYEBROW
   ========================================================= */
.eyebrow {
  display: inline-flex; align-items: center; flex-wrap: wrap; gap: 8px 12px;
  font-size: 12.5px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--brand); font-weight: 700;
  margin-bottom: 16px;
}
@media (max-width: 420px) { .eyebrow { font-size: 11.5px; letter-spacing: .08em; } }

/* Pastille saisonnière « Offre Halloween » */
.season-badge {
  display: inline-block; white-space: nowrap;
  font-family: var(--font-display); font-weight: 700;
  font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
  padding: 7px 14px; border-radius: 999px;
  background: var(--accent); color: #fff;
}
:root[data-theme="halloween"] .season-badge {
  font-family: 'Creepster', var(--font-display); font-weight: 400;
  font-size: 24px; letter-spacing: .03em; line-height: 1;
  padding: 7px 16px 5px;
  color: #1c0d03;
  transform: rotate(-2.5deg);
  box-shadow: 0 6px 20px -6px rgba(232,112,42,.7);
}
@media (max-width: 420px) { :root[data-theme="halloween"] .season-badge { font-size: 21px; } }

/* =========================================================
   ARAIGNÉE (thème halloween) · descend du header au chargement
   ========================================================= */
.spider {
  position: absolute; z-index: 40;
  top: calc(21px + 52px + var(--banner-h) - 6px);
  left: calc(50% + 170px);
  width: 56px; margin-left: -28px;
  pointer-events: none;
  transform-origin: 50% 0;
  --drop: 160px;
}
.spider-thread {
  position: absolute; left: 50%; top: 0;
  width: 1px; height: var(--drop);
  background: linear-gradient(rgba(255,255,255,.15), rgba(255,255,255,.55));
  transform-origin: 50% 0;
}
.spider-body {
  position: absolute; left: 0; top: 0;
  width: 56px; height: 56px;
  transform: translateY(calc(var(--drop) - 10px));
  pointer-events: auto; cursor: pointer;
}
.spider-body svg { display: block; width: 100%; height: 100%; }
@media (prefers-reduced-motion: no-preference) {
  .spider { animation: sway 4.5s ease-in-out 2.6s infinite; }
  .spider-thread { animation: thread-drop 2.4s cubic-bezier(.3,.7,.2,1) .4s both; }
  .spider-body { animation: body-drop 2.4s cubic-bezier(.3,.7,.2,1) .4s both; }
  .spider.is-up .spider-thread { animation: thread-up .9s cubic-bezier(.6,0,.8,.4) both; }
  .spider.is-up .spider-body   { animation: body-up .9s cubic-bezier(.6,0,.8,.4) both; }
}
.spider.is-up.no-anim { display: none; }
@keyframes thread-drop { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes body-drop { from { transform: translateY(-60px); } to { transform: translateY(calc(var(--drop) - 10px)); } }
@keyframes thread-up { from { transform: scaleY(1); } to { transform: scaleY(0); } }
@keyframes body-up { from { transform: translateY(calc(var(--drop) - 10px)); } to { transform: translateY(-60px); } }
@keyframes sway { 0%,100% { transform: rotate(0deg); } 30% { transform: rotate(4deg); } 70% { transform: rotate(-3deg); } }
@media (max-width: 760px) {
  .spider { left: 84%; --drop: 34px; width: 38px; margin-left: -19px; }
  .spider-body { width: 38px; height: 38px; }
}

/* =========================================================
   HERO
   ========================================================= */
.hero-wrap {
  position: relative;
  padding: 5px;
  height: 100dvh;
  min-height: 720px;
}
@media (max-width: 768px) {
  .hero-wrap { height: auto; min-height: 0; }
}
.hero {
  position: relative;
  height: 100%;
  display: flex; flex-direction: column; justify-content: flex-end;
  overflow: hidden; isolation: isolate;
  color: #fff;
  border-radius: 15px;
  background: var(--hero-fallback);
}
@media (max-width: 768px) {
  .hero { min-height: 640px; padding-top: calc(110px + var(--banner-h)); }
}
.hero-bg {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: 50% 30%;
  z-index: -2;
  will-change: transform;
}
.has-hero-img .hero::before {
  content: '';
  position: absolute; inset: 0;
  background:
    linear-gradient(to right, rgba(8,18,30,.88) 0%, rgba(8,18,30,.72) 32%, rgba(8,18,30,.2) 62%, transparent 82%),
    linear-gradient(to top, rgba(8,18,30,.55) 0%, transparent 50%);
  z-index: -1;
}
@media (max-width: 900px) {
  .has-hero-img .hero::before {
    background: linear-gradient(to bottom, rgba(8,18,30,.4) 0%, rgba(8,18,30,.75) 50%, rgba(8,18,30,.94) 100%);
  }
}
/* Fond sombre en attendant le visuel */
.hero::after {
  content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(50% 45% at 82% 22%, var(--accent-soft) 0%, transparent 70%);
}
.has-hero-img .hero::after { display: none; }
.hero-placeholder {
  position: absolute; top: calc(92px + var(--banner-h)); right: 28px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: rgba(255,255,255,.35);
  border: 1px dashed rgba(255,255,255,.22); border-radius: 999px;
  padding: 6px 12px;
}
.has-hero-img .hero-placeholder { display: none; }
@media (max-width: 768px) { .hero-placeholder { top: auto; bottom: 16px; right: 16px; } }

.hero-inner {
  display: flex; flex-direction: column; align-items: flex-start;
  padding: 0 72px 84px;
  max-width: 860px; width: 100%;
}
@media (max-width: 900px) { .hero-inner { padding: 0 28px 64px; max-width: 100%; } }
@media (max-width: 600px) { .hero-inner { padding: 0 20px 56px; } }

.hero .eyebrow { color: rgba(255,255,255,.82); }
.hero h1 { color: #fff; margin: 0; }
.hero h1 .h1-l1 {
  display: block;
  font-size: clamp(30px, 3.4vw, 50px);
  line-height: 1; letter-spacing: -0.03em;
}
.hero h1 .h1-price {
  display: block;
  margin-top: 10px;
  font-size: clamp(64px, 8.5vw, 120px);
  line-height: .9; letter-spacing: -0.045em;
  white-space: nowrap;
}
.hero-sub {
  margin: 22px 0 0;
  font-size: clamp(17px, 1.25vw, 19px);
  line-height: 1.55;
  color: rgba(255,255,255,.84);
  max-width: 46ch;
  font-weight: 500;
}
.hero-cta {
  margin-top: 34px;
  display: inline-flex; align-items: center; gap: 12px;
  padding: 17px 30px;
  background: #fff; color: var(--brand-ink);
  border-radius: 999px;
  font-size: 16.5px; font-weight: 700;
  box-shadow: 0 8px 28px rgba(0,0,0,.22);
  transition: transform .18s, background .18s;
}
.hero-cta:hover { background: var(--brand-100); transform: translateY(-1px); }
@media (max-width: 600px) { .hero-cta { width: 100%; justify-content: space-between; } }

/* Encart récap des formules (desktop) · verre dépoli */
.hero-recap {
  position: absolute; right: 56px; bottom: 84px;
  width: 340px;
  padding: 20px 20px 12px;
  border-radius: 20px;
  background: rgba(255,255,255,.07);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid rgba(255,255,255,.12);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 20px 40px -20px rgba(0,0,0,.5);
}
.recap-title {
  display: block; margin-bottom: 8px;
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700;
  color: rgba(255,255,255,.6);
}
.recap-row {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
  padding: 14px 0;
  border-top: 1px solid rgba(255,255,255,.1);
  color: #fff;
}
.recap-row:first-of-type { border-top: 0; }
.recap-name { font-family: var(--font-display); font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: -0.01em; }
.recap-val { font-size: 16px; font-weight: 500; color: rgba(255,255,255,.75); }
.recap-row:hover .recap-val { color: #fff; }
@media (max-width: 1100px) { .hero-recap { display: none; } }

/* Compte à rebours */
.countdown { margin-top: 28px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px 18px; }
.countdown-label { font-size: 16px; font-weight: 600; color: rgba(255,255,255,.78); display: inline-flex; align-items: center; gap: 8px; }
.countdown-label::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 10px var(--accent);

}
.countdown-units { display: flex; gap: 8px; }
.cd-unit {
  min-width: 70px; padding: 9px 6px 8px;

  text-align: center;
}
.cd-unit b { display: block; font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.cd-unit span { display: block; margin-top: 4px; font-size: 12px; color: rgba(255,255,255,.62); }
@media (max-width: 420px) {
  .countdown, .countdown-units { width: 100%; }
  .cd-unit { min-width: 0; flex: 1; }
}

/* Offre terminée */
.ended-box {
  margin-top: 30px; padding: 18px 22px;
  border-radius: 16px;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
  max-width: 46ch;
}
.ended-box strong { display: block; font-size: 18px; margin-bottom: 4px; }
.ended-box p { margin: 0; font-size: 17px; color: rgba(255,255,255,.8); }
.ended-box a { text-decoration: underline; text-underline-offset: 3px; }

/* =========================================================
   TITRES DE SECTION
   ========================================================= */
.section { padding-top: 96px; }
.section-head { margin-bottom: 36px; max-width: 760px; }
.section-title { font-size: clamp(30px, 3.6vw, 46px); letter-spacing: -0.028em; line-height: 1.02; }
.section-sub { margin: 12px 0 0; font-size: 18px; line-height: 1.5; color: var(--ink-3); max-width: 60ch; }
@media (max-width: 760px) {
  .section { padding-top: 72px; }
  .section-head { margin-bottom: 28px; }
  .section-sub { font-size: 17px; }
}

/* =========================================================
   CARTES FORMULES
   ========================================================= */
.plans { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: stretch; }
@media (max-width: 900px) { .plans { grid-template-columns: 1fr; gap: 20px; } }

.plan {
  background: var(--soft);
  border: 1px solid var(--brand-100);
  border-radius: 24px;
  padding: 32px 30px 30px;
  display: flex; flex-direction: column;
  position: relative;
}
@media (max-width: 600px) { .plan { padding: 26px 20px 22px; } }
.plan.featured { background: #fff; border: 2px solid var(--brand); box-shadow: 0 20px 48px -16px rgba(32,77,110,.35); }
.plan-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.plan-name { font-size: 36px; letter-spacing: -0.03em; line-height: 1; text-transform: uppercase; }
@media (max-width: 600px) { .plan-name { font-size: 30px; } }
.plan-badge { font-size: 13px; padding: 6px 11px; }

.plan-tagline { margin: 10px 0 0; font-size: 17px; line-height: 1.45; color: var(--ink-3); }

/* Durée + accès : les deux chiffres qui distinguent les formules */
.plan-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.fact { position: relative; padding: 14px 16px 16px; border-radius: 14px; background: #fff; border: 1px solid rgba(10,37,64,.08); }
.plan.featured .fact { background: var(--brand-50); border-color: var(--brand-100); }
.fact-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 24px; font-size: 15px; font-weight: 500; color: var(--ink-3); }
.fact-val { display: block; margin-top: 4px; font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: -0.03em; color: var(--brand-ink); }
.fact-val small { font-size: 18px; letter-spacing: -0.01em; margin-left: 5px; }
@media (max-width: 380px) { .fact-val { font-size: 34px; } .fact { padding: 12px 12px 14px; } }
.info-btn {
  width: 24px; height: 24px; border-radius: 50%;
  display: inline-grid; place-items: center;
  background: var(--brand-100); color: var(--brand-ink);
  font-size: 13px; font-weight: 700; font-style: italic; font-family: Georgia, serif;
  transition: background .15s;

/* =========================================================
   DANS LES CLUBS · photos puis aperçu des cours

.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.photo { margin: 0; position: relative; }

.cours { margin-top: 80px; }

.closing { position: relative; padding: 96px 0; overflow: hidden; isolation: isolate; color: #fff; background: var(--closing-bg); }

.btn-light {

}
.btn-light:hover { background: var(--brand-100); }

.closing .ended-box { margin-top: 0; text-align: center; }
@media (max-width: 600px) { .closing { padding: 72px 0; } .btn-light { width: 100%; } }

   ========================================================= */
.foot { padding: 40px 0 36px; background: var(--ink); color: rgba(255,255,255,.62); font-size: 15px; }

.foot-links { display: flex; flex-wrap: wrap; gap: 8px 22px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.1); }

/* =========================================================
   BOUTON FIXÉ EN BAS (mobile)
   ========================================================= */
.sticky-cta { display: none; }
@media (max-width: 900px) {

    display: block;

    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));

    box-shadow: var(--glass-shadow);

}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }

  function el(id) { return document.getElementById(id); }
  function tag(premium, label) {
    return '<span class="tag' + (premium ? ' premium' : '') + '">' + txt(label || (premium ? 'Premium' : 'Essential')) + '</span>';
  }

  /* ---------- UTM : transmis aux liens d'achat ---------- */
  var UTM_KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'];
  var utm = {};
  (function () {
    var p = new URLSearchParams(location.search);
    UTM_KEYS.forEach(function (k) { var v = p.get(k); if (v) utm[k] = v; });
    var KEY = 'offre_' + C.slug + '_utm';
    try {
      if (Object.keys(utm).length) sessionStorage.setItem(KEY, JSON.stringify(utm));
      else utm = JSON.parse(sessionStorage.getItem(KEY) || '{}') || {};
    } catch (e) { /* stockage indisponible : on garde les UTM de l'URL */ }
  })();
  function buyUrl(f) {
    var url = C.checkoutUrl + encodeURIComponent(f.produitId);
    UTM_KEYS.forEach(function (k) { if (utm[k]) url += '&' + k + '=' + encodeURIComponent(utm[k]); });
    return url;
  }
  function buyCta(f, position) {
    return '<a class="plan-cta hide-termine" href="' + esc(buyUrl(f)) + '" target="_blank" rel="noopener"' +
      ' data-formule="' + esc(f.id) + '" data-position="' + esc(position) + '">' + txt(f.cta) + '</a>';
  }

  /* ---------- Clubs ---------- */
  var CANTONS = ['Genève', 'Vaud'];
  var BASE = C.formules[0].categories;               // catégories couvertes par l'Essential
  function clubsFor(cats) { return C.clubs.filter(function (c) { return cats.indexOf(c.categorie) !== -1; }); }
  function byCanton(list) {
    return CANTONS.map(function (ct) {
      return { canton: ct, clubs: list.filter(function (c) { return c.canton === ct; }) };
    }).filter(function (g) { return g.clubs.length; });
  }

  /* ---------- Textes simples ---------- */
  document.querySelectorAll('[data-t]').forEach(function (n) {
    var v = get(n.getAttribute('data-t'));
    if (v != null) n.innerHTML = txt(v);
  });

  /* ---------- Hero : visuel + encart ---------- */
  if (C.visuels.hero) {
    root.classList.add('has-hero-img');
    var bg = document.querySelector('.hero-bg');
    bg.style.backgroundImage = 'url("' + C.visuels.hero.replace(/"/g, '%22') + '")';
    bg.setAttribute('aria-label', C.nom);
  }
  // Encart récap (desktop) : mène aux cartes, l'achat se fait après la présentation des formules
  el('hero-recap').innerHTML = '<span class="recap-title">' + txt(C.hero.recapTitre) + '</span>' +
    C.formules.map(function (f) {
      return '<a class="recap-row" href="#formule-' + esc(f.id) + '">' +
        '<span class="recap-name">' + txt(f.titre) + '</span>' +
        '<span class="recap-val">' + txt(f.resume) + '</span></a>';
    }).join('');

  /* ---------- Habillage saisonnier ---------- */
  var DECO = (C.deco && C.theme === 'halloween') ? C.deco : {};
  if (DECO.araignee) {
    (function () {
      var sp = el('spider'), body = sp.querySelector('.spider-body');
      sp.hidden = false;
      var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) sp.classList.add('no-anim');
      // Un clic la fait remonter, elle redescend un peu plus tard
      body.addEventListener('click', function () {
        if (sp.classList.contains('is-up')) return;
        sp.classList.add('is-up');
        setTimeout(function () {
          sp.classList.remove('is-up');
          // relance l'animation de descente
          sp.querySelectorAll('.spider-thread, .spider-body').forEach(function (n) { n.style.animation = 'none'; void n.offsetWidth; n.style.animation = ''; });
        }, 7000);
      });
    })();
  }
  if (DECO.curseurFantome && matchMedia('(hover: hover) and (pointer: fine)').matches) {
    (function () {
      function ghost(size) {
        var c = document.createElement('canvas'); c.width = c.height = size + 8;
        var x = c.getContext('2d');
        x.font = size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
        x.textAlign = 'center'; x.textBaseline = 'middle';
        x.fillText('\uD83D\uDC7B', c.width / 2, c.height / 2 + 1);
        return 'url(' + c.toDataURL('image/png') + ') ' + Math.round(c.width / 2) + ' ' + Math.round(c.height / 2);
      }
      try {
        root.style.setProperty('--cursor-ghost', ghost(26) + ', auto');
        root.style.setProperty('--cursor-ghost-hover', ghost(34) + ', pointer');
        root.classList.add('ghost-cursor');
      } catch (e) { /* canvas indisponible : curseur normal */ }
    })();
  }

  /* ---------- Cartes formules ---------- */
  function ligneVal(v) {
    if (v === true)  return { on: true,  val: 'Inclus' };
    if (v === false || v == null) return { on: false, val: 'Non inclus' };
    return { on: true, val: v };
  }
  el('formules').innerHTML = C.formules.map(function (f) {
    var pop = byCanton(clubsFor(f.categories)).map(function (g) {
      return '<div class="pop-canton"><h4>Canton de ' + esc(g.canton) + '</h4><ul>' +
        g.clubs.map(function (c) { return '<li>' + txt(c.nom) + '</li>'; }).join('') + '</ul></div>';
    }).join('');
    // Lignes qui distinguent les formules : mises en avant ; « Premium » sur celles que l'Essential n'a pas
    var lignes = C.lignes.map(function (l) {
      var r = ligneVal(f.inclus[l.cle]);
      var vals = C.formules.map(function (x) { return String(x.inclus[l.cle]); });
      var diff = vals.some(function (v) { return v !== vals[0]; });
      var exclusive = r.on && C.formules.some(function (x) { return !ligneVal(x.inclus[l.cle]).on; });
      return '<li class="feat' + (r.on ? '' : ' off') + (diff && r.on ? ' diff' : '') + '">' +
        '<span class="feat-icon">' + (r.on ? ICO.check : ICO.dash) + '</span>' +
        '<span class="feat-label">' + txt(l.label) + (exclusive ? tag(true, C.tagDiff) : '') + '</span>' +
        '<span class="feat-val">' + txt(r.val) + '</span></li>';
    }).join('');
    var popId = 'clubs-pop-' + f.id;
    return '<article class="plan' + (f.badge ? ' featured' : '') + '" id="formule-' + esc(f.id) + '">' +
      '<div class="plan-top"><h3 class="plan-name">' + txt(f.titre) + '</h3>' +
        (f.badge ? '<span class="tag premium plan-badge">' + txt(f.badge) + '</span>' : '') + '</div>' +
      '<p class="plan-tagline">' + txt(f.accroche) + '</p>' +
      '<div class="plan-facts">' +
        '<div class="fact"><span class="fact-label">Durée</span>' +
          '<span class="fact-val">' + esc(f.duree).replace(/^(\d+)\s*(.*)$/, '$1<small>$2</small>') + '</span></div>' +
        '<div class="fact fact-clubs"><span class="fact-label">Accès' +
          '<button type="button" class="info-btn" aria-expanded="false" aria-controls="' + popId + '" aria-label="Voir la liste des clubs">i</button></span>' +
          '<span class="fact-val">' + clubsFor(f.categories).length + '<small>clubs</small></span>' +
          '<div class="clubs-pop" id="' + popId + '" role="tooltip">' + pop + '</div></div>' +
      '</div>' +
      '<ul class="features-list">' + lignes + '</ul>' +
      '<div class="plan-price-block">' +
        '<div class="plan-price"><span class="amount">' + txt(f.prix) + '</span><span class="per">pour ' + txt(f.duree) + '</span></div>' +
        '<div class="price-meta">' + txt(f.sousPrix) + '</div>' +
        buyCta(f, 'carte') +
        '<p class="plan-reassure hide-termine">' + txt(C.reassurance) + '</p>' +
        '<div class="plan-ended only-termine">' + txt(C.termine.titre) + '</div>' +
      '</div>' +
    '</article>';
  }).join('');

  /* ---------- Dans les clubs : photos ---------- */
  el('photos').innerHTML = C.dansLesClubs.photos.map(function (p) {
    return '<figure class="photo"><img src="' + esc(p.image) + '" alt="' + esc(p.alt) + '" loading="lazy" decoding="async">' +
      (p.premium ? tag(true, C.dansLesClubs.notePremium) : '') +
      '<figcaption><h3>' + txt(p.titre) + '</h3>' +
      '<p>' + txt(p.texte) + '</p></figcaption></figure>';
  }).join('');

  /* ---------- Dans les clubs : aperçu des cours + Small Group Training ---------- */
  (function () {
    var K = C.coursSection;
    el('cours').innerHTML =
      '<div class="cours-head"><div><h3>' + txt(K.titre) + '</h3><p>' + txt(K.sousTitre) + '</p></div>' +
        '<span class="cours-legend">' + tag(true) + txt(K.legendePremium) + '</span></div>' +
      K.groupes.map(function (g) {
        return '<div class="cours-group"><h4>' + txt(g.objectif) + '</h4><ul class="cours-list">' +
          g.cours.map(function (c) { return '<li class="cours-chip">' + txt(c.nom) + (c.premium ? tag(true) : '') + '</li>'; }).join('') +
          '<li class="cours-chip more">' + txt(K.plusLabel) + '…</li></ul></div>';
      }).join('') +
      '<p class="cours-note">' + txt(K.note) + '</p>' +
      '<div class="sgt-box"><div class="sgt-head"><h4>' + txt(K.sgt.titre) + '</h4><span class="sgt-badge">' + txt(K.sgt.badge) + '</span></div>' +
        '<div class="sgt-body"><p>' + txt(K.sgt.texte) + '</p><ul class="cours-list">' +
          K.sgt.cours.map(function (n) { return '<li class="sgt-chip">' + txt(n) + '</li>'; }).join('') +
        '</ul></div></div>';
  })();

  /* ---------- Clubs : liste numérotée + carte ---------- */
  (function () {
    var groups = byCanton(C.clubs), n = 0;
    groups.forEach(function (g) { g.clubs.forEach(function (c) { c.num = ++n; c.premium = BASE.indexOf(c.categorie) === -1; }); });

    el('clubs-list').innerHTML =
      '<ul class="clubs-legend">' +
        '<li>' + tag(false) + txt(C.clubsSection.legendeEssential) + '</li>' +
        '<li>' + tag(true) + txt(C.clubsSection.legendePremium) + '</li>' +
      '</ul>' +
      groups.map(function (g) {
        return '<div class="canton"><h3>Canton de ' + esc(g.canton) + '</h3><ol class="club-rows">' +
          g.clubs.map(function (c) {
            return '<li class="club-row' + (c.premium ? ' premium' : '') + '" data-club="' + c.num + '">' +
              '<span class="club-num" aria-hidden="true">' + c.num + '</span>' +
              '<span>' + txt(c.nom) + '</span>' + tag(c.premium) + '</li>';
          }).join('') + '</ol></div>';
      }).join('');

    // Même projection que le script qui a généré images/carte-leman.svg
    var M = C.carte, K = 1000, COS = Math.cos((M.lat0 + M.lat1) / 2 * Math.PI / 180);
    var W = (M.lon1 - M.lon0) * COS * K, H = (M.lat1 - M.lat0) * K;
    function xy(lat, lon) { return [((lon - M.lon0) * COS * K).toFixed(1), ((M.lat1 - lat) * K).toFixed(1)]; }
    var svg = '<svg viewBox="0 0 ' + W.toFixed(1) + ' ' + H.toFixed(1) + '" role="img" aria-label="Carte des 10 clubs Harmony autour du Léman">' +
      '<image href="' + esc(M.image) + '" x="0" y="0" width="' + W.toFixed(1) + '" height="' + H.toFixed(1) + '"/>' +
      M.libelles.map(function (l) {
        var p = xy(l.lat, l.lon);
        return '<text class="map-label' + (l.texte === 'Léman' ? ' lake' : '') + '" x="' + p[0] + '" y="' + p[1] + '">' + esc(l.texte) + '</text>';
      }).join('') +
      C.clubs.slice().sort(function (a, b) { return b.lat - a.lat; }).map(function (c) {
        var p = xy(c.lat, c.lon);
        return '<g class="pin' + (c.premium ? ' premium' : '') + '" data-club="' + c.num + '"><title>' + esc(c.nom) + '</title>' +
          '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="8"/><text x="' + p[0] + '" y="' + p[1] + '">' + c.num + '</text></g>';
      }).join('') + '</svg>';
    el('clubs-map').innerHTML = svg + '<figcaption>Emplacements indicatifs. Fond de carte © OpenStreetMap.</figcaption>';

    // Survol / toucher : la ligne et le repère s'allument ensemble
    function activate(num) {
      document.querySelectorAll('[data-club]').forEach(function (n) {
        var on = n.getAttribute('data-club') === num;
        n.classList.toggle('is-active', on);
        if (on && n.classList.contains('pin')) n.parentNode.appendChild(n);   // repère actif au premier plan
      });
    }
    var zone = document.querySelector('.clubs-layout');
    zone.addEventListener('mouseover', function (e) {
      var t = e.target.closest && e.target.closest('[data-club]');
      activate(t ? t.getAttribute('data-club') : null);
    });
    zone.addEventListener('mouseleave', function () { activate(null); });
    zone.addEventListener('click', function (e) {
      var t = e.target.closest && e.target.closest('[data-club]');
      if (t) activate(t.getAttribute('data-club'));
    });
  })();

  /* ---------- FAQ ---------- */
  el('faq-contact').innerHTML = 'Une autre question ? Écrivez à <a href="mailto:' + esc(C.liens.contactEmail) + '">' +
    esc(C.liens.contactEmail) + '</a> ou passez à l’accueil de votre club.';
  el('faq').innerHTML = C.faq.map(function (it, i) {
    return '<div class="faq-item"><button class="faq-q" type="button" aria-expanded="false" aria-controls="faq-a-' + i + '">' +
      '<span>' + txt(it.q) + '</span><span class="faq-icon">' + ICO.plus + '</span></button>' +
      '<div class="faq-a" id="faq-a-' + i + '"><p>' + txt(it.r) + '</p></div></div>';
  }).join('');

  /* ---------- Offre terminée ---------- */
  document.querySelectorAll('[data-ended]').forEach(function (n) {
    n.innerHTML = '<strong>' + txt(C.termine.titre) + '</strong><p>' +
      txt(C.termine.texte).replace('harmony.ch', '<a href="' + esc(C.termine.lien) + '">harmony.ch</a>') + '</p>';
  });

  /* ---------- Pied de page ---------- */
  el('mentions').innerHTML = txt(C.mentions) + ' Voir les ' +
    (C.liens.conditions
      ? '<a href="' + esc(C.liens.conditions) + '" target="_blank" rel="noopener">conditions de l’offre</a>.'
      : 'conditions de l’offre <span class="todo">[À CONFIRMER : lien CGV promo]</span>.');
  el('foot-links').innerHTML =
    '<a href="mailto:' + esc(C.liens.contactEmail) + '">Contact : ' + esc(C.liens.contactEmail) + '</a>' +
    '<a href="' + esc(C.liens.mentionsLegales) + '" target="_blank" rel="noopener">Mentions légales</a>' +
    '<a href="' + esc(C.liens.confidentialite) + '" target="_blank" rel="noopener">Politique de confidentialité</a>' +
    '<span class="copy">© ' + new Date(T_FIN).getFullYear() + ' Harmony Fitness</span>';

  /* ---------- Phase + compte à rebours ---------- */
  var CD_UNITS = [['j', 'jours'], ['h', 'heures'], ['m', 'min'], ['s', 'sec']];
  document.querySelectorAll('[data-countdown]').forEach(function (n) {
    n.innerHTML = '<span class="countdown-label">' + txt(C.compteRebours) + '</span><div class="countdown-units">' +
      CD_UNITS.map(function (u) { return '<div class="cd-unit"><b data-cd="' + u[0] + '">00</b><span>' + u[1] + '</span></div>'; }).join('') + '</div>';
  });
  function phase(t) { return t > T_FIN ? 'termine' : t >= T_PUBLIC ? 'public' : 'avant'; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  var current = null;
  function tick() {
    var t = now(), ph = phase(t);
    if (ph !== current) {
      root.classList.remove('phase-avant', 'phase-public', 'phase-termine');
      root.classList.add('phase-' + ph);
      current = ph;
    }
    if (ph === 'public') {
      var s = Math.max(0, Math.floor((T_FIN - t) / 1000) + 1);
      var v = { j: Math.floor(s / 86400), h: Math.floor(s % 86400 / 3600), m: Math.floor(s % 3600 / 60), s: s % 60 };
      document.querySelectorAll('[data-cd]').forEach(function (b) { b.textContent = pad(v[b.getAttribute('data-cd')]); });
    }
  }
  tick();
  setInterval(tick, 1000);

  /* ---------- Tracking GTM ---------- */
  window.dataLayer = window.dataLayer || [];
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[data-formule]');
    if (!a) return;
    window.dataLayer.push({
      event: C.gtmEvent,
      offre: C.utmCampaign,
      formule: a.getAttribute('data-formule'),
      cta_position: a.getAttribute('data-position')
    });
  });

  /* ---------- Info clubs : survol desktop, toucher mobile ---------- */
  function closePops(except) {
    document.querySelectorAll('.info-btn[aria-expanded="true"]').forEach(function (b) {
      if (b === except) return;
      b.setAttribute('aria-expanded', 'false');
      el(b.getAttribute('aria-controls')).classList.remove('is-open');
    });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.info-btn');
    if (b) {
      var open = b.getAttribute('aria-expanded') === 'true';
      closePops(b);
      b.setAttribute('aria-expanded', open ? 'false' : 'true');
      el(b.getAttribute('aria-controls')).classList.toggle('is-open', !open);
      return;
    }
    if (!(e.target.closest && e.target.closest('.clubs-pop'))) closePops();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePops(); });

  /* ---------- FAQ accordéon ---------- */
  document.querySelectorAll('.faq-q').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var item = btn.closest('.faq-item');
      var open = item.classList.contains('is-open');
      document.querySelectorAll('.faq-item').forEach(function (i) {
        i.classList.remove('is-open');
        i.querySelector('.faq-q').setAttribute('aria-expanded', 'false');
      });
      if (!open) { item.classList.add('is-open'); btn.setAttribute('aria-expanded', 'true'); }
    });
  });

  /* ---------- Bouton fixé en bas (mobile) : après le hero, masqué sur les cartes ---------- */
  (function () {
    var bar = el('sticky-cta'), hero = el('hero'), plans = el('formules');
    if (!bar || !('IntersectionObserver' in window)) return;
    var heroVisible = true, plansVisible = false;
    function update() {
      var show = !heroVisible && !plansVisible;
      bar.classList.toggle('is-visible', show);
      root.style.setProperty('--sticky-h', show && innerWidth <= 900 ? bar.offsetHeight + 'px' : '0px');
    }
    new IntersectionObserver(function (en) { heroVisible = en[0].isIntersecting; update(); }, { threshold: 0.2 }).observe(hero);
    new IntersectionObserver(function (en) { plansVisible = en[0].isIntersecting; update(); }, { threshold: 0.15 }).observe(plans);
  })();

  /* ---------- Header : rétrécit au défilement (desktop) ---------- */
  (function () {
    var topbar = document.querySelector('.topbar'), pending = false;
    function f() {
      pending = false;
      if (innerWidth <= 600) { topbar.style.width = ''; return; }
      var t = Math.min(scrollY / 180, 1), ease = 1 - Math.pow(1 - t, 2);
      topbar.style.width = Math.round(500 - 100 * ease) + 'px';
    }
    addEventListener('scroll', function () { if (!pending) { pending = true; requestAnimationFrame(f); } }, { passive: true });
  })();
})();
</script>
</body>
</html>
