<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Harmony Fitness · Abonnements</title>
<meta name="description" content="Rejoignez Harmony Fitness en Suisse romande. Découvrez nos abonnements et nos 9 clubs." />
<meta property="og:title" content="Harmony Fitness · Abonnements" />
<meta property="og:description" content="Rejoignez Harmony Fitness en Suisse romande. Découvrez nos abonnements et nos 9 clubs." />
<meta property="og:url" content="https://offres.harmony.ch/" />
<meta property="og:type" content="website" />
<meta property="og:locale" content="fr_CH" />
<meta name="robots" content="noindex,follow" />

<link rel="icon" type="image/png" href="444/images/favicon-harmony.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />

<style>
/* =========================================================
   Eliptik Harmony
   ========================================================= */
@font-face {
  font-family: 'Eliptik Harmony';
  src: url('fonts/Eliptik-Harmony-Thin.ttf') format('truetype');
  font-weight: 100; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Eliptik Harmony';
  src: url('fonts/Eliptik-Harmony-Light.ttf') format('truetype');
  font-weight: 300; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Eliptik Harmony';
  src: url('fonts/Eliptik-Harmony-Regular.ttf') format('truetype');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Eliptik Harmony';
  src: url('fonts/Eliptik-Harmony-Bold.ttf') format('truetype');
  font-weight: 700; font-style: normal; font-display: swap;
}

/* =========================================================
   DESIGN TOKENS
   ========================================================= */
:root {
  --brand:      #3a8fc2;
  --brand-600:  #2b7aaa;
  --brand-700:  #1e6390;
  --brand-ink:  #0a3d5c;
  --brand-deep: #0a2540;
  --brand-300:  #8cc1de;
  --brand-200:  #c9e0ee;
  --brand-100:  #e4eff6;
  --brand-50:   #f3f8fb;

  --ink:   #0a1820;
  --ink-2: #2a3a44;
  --ink-3: #556772;
  --ink-4: #8a99a3;
  --ink-5: #b9c4cb;

  --line:   #e6e9ec;
  --line-2: #f1f3f5;
  --canvas: #ffffff;
  --soft-blue: #eff6fb;

  --green:       #22c55e;
  --green-light: #4ade80;

  --font-sans:    "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:    "Geist Mono", ui-monospace, "SF Mono", monospace;
  --font-display: 'Eliptik Harmony', "Geist", system-ui, sans-serif;

  --grad-brand:     linear-gradient(135deg, #4aa3d8 0%, #2b7aaa 60%, #1e6390 100%);
  --grad-premium:   linear-gradient(150deg, #1e6390 0%, #0a3d5c 55%, #0a2540 100%);
  --grad-cta:       linear-gradient(135deg, #4aa3d8 0%, #2b7aaa 100%);
  --grad-cta-hover: linear-gradient(135deg, #5cb3e6 0%, #3a8fc2 100%);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--canvas); }
body {
  font-family: var(--font-sans);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
  letter-spacing: -0.005em;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

h1, h2 {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.05;
  color: var(--ink);
  margin: 0;
  text-transform: uppercase;
}

.shell { max-width: 1360px; margin: 0 auto; padding: 0 40px; width: 100%; }
@media (max-width: 900px) { .shell { padding: 0 20px; } }

/* =========================================================
   TOPBAR — pill flottant, glassmorphism
   ========================================================= */
.topbar {
  position: fixed;
  top: 21px;
  left: 50%; transform: translateX(-50%);
  width: 500px;
  max-width: calc(100% - 32px);
  z-index: 50;
  background: rgba(255,255,255,.75);
  backdrop-filter: blur(36px) saturate(220%);
  -webkit-backdrop-filter: blur(36px) saturate(220%);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 999px;
  box-shadow: 0 8px 32px rgba(10,37,64,.14), 0 1px 0 rgba(255,255,255,.9) inset;
  overflow: hidden;
}
.topbar-inner {
  display: flex; align-items: center; justify-content: space-between;
  height: 52px; gap: 16px;
  padding: 0 6px 0 16px;
}
.topbar-inner > a { flex-shrink: 0; }
.logo-img { height: 28px; width: auto; display: block; }
.btn-primary {
  padding: 11px 20px; font-size: 13px; font-weight: 600;
  background: var(--grad-cta); color: #fff;
  border-radius: 999px;
  box-shadow: 0 1px 2px rgba(10,37,64,.12), 0 4px 12px rgba(58,143,194,.25);
  transition: transform .15s, box-shadow .18s, background .18s;
  white-space: nowrap;
  flex-shrink: 0;
  display: inline-flex; align-items: center; gap: 8px;
}
.btn-primary:hover {
  background: var(--grad-cta-hover);
  box-shadow: 0 2px 4px rgba(10,37,64,.15), 0 8px 20px rgba(58,143,194,.35);
  transform: translateY(-1px);
}

/* =========================================================
   EYEBROW
   ========================================================= */
.eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-sans);
  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(255,255,255,.72); font-weight: 600;
  margin-bottom: 20px;
}
.eyebrow::before { content: ""; width: 28px; height: 2px; background: rgba(255,255,255,.38); border-radius: 2px; }

/* =========================================================
   STAGE — pleine page, fond gradient premium
   ========================================================= */
.stage-wrap {
  flex: 1;
  padding: 5px;
  min-height: 100dvh;
}
.stage {
  position: relative;
  min-height: calc(100dvh - 10px);
  border-radius: 15px;
  overflow: hidden;
  isolation: isolate;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 120px 40px 80px;
  text-align: center;
}
.stage-bg {
  position: absolute; inset: 0;
  background: var(--grad-premium);
  z-index: -2;
}
.stage::before {
  content: '';
  position: absolute;
  inset: -30% -20% auto auto;
  width: 70%; height: 70%;
  background: radial-gradient(circle, rgba(74,163,216,.35) 0%, transparent 65%);
  z-index: -1;
  pointer-events: none;
}
.stage::after {
  content: '';
  position: absolute;
  inset: auto auto -30% -20%;
  width: 60%; height: 60%;
  background: radial-gradient(circle, rgba(58,143,194,.22) 0%, transparent 65%);
  z-index: -1;
  pointer-events: none;
}

.stage-inner {
  max-width: 760px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.stage h1 {
  font-size: clamp(40px, 5.6vw, 76px);
  line-height: 0.95;
  letter-spacing: -0.03em;
  color: #fff;
  text-transform: uppercase;
  margin-bottom: 28px;
}

.stage-lead {
  font-size: clamp(15px, 1.4vw, 17px);
  line-height: 1.6;
  color: rgba(255,255,255,.78);
  max-width: 52ch;
  margin: 0 0 40px;
}
.stage-lead strong { color: #fff; font-weight: 600; }

.stage-cta {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 18px 32px;
  background: #fff; color: var(--brand-ink);
  border-radius: 999px;
  font-size: 15px; font-weight: 700;
  box-shadow: 0 8px 28px rgba(0,0,0,.22);
  transition: transform .18s, background .18s;
}
.stage-cta:hover { background: var(--brand-100); transform: translateY(-1px); }
.stage-cta .arrow { display: inline-flex; transition: transform .2s; }
.stage-cta:hover .arrow { transform: translateX(4px); }

.stage-meta {
  margin-top: 28px;
  font-size: 13px;
  color: rgba(255,255,255,.55);
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.stage-meta .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green-light);
  box-shadow: 0 0 10px var(--green-light);
  animation: pulseBlink 1.6s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes pulseBlink { 0%,100%{opacity:1} 50%{opacity:.3} }

@media (max-width: 600px) {
  .stage { padding: 120px 24px 60px; }
  .stage-cta { width: 100%; max-width: 360px; justify-content: space-between; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<!-- ============ TOPBAR ============ -->
<header class="topbar">
  <div class="topbar-inner shell">
    <a href="https://harmony.ch" aria-label="Harmony Fitness">
      <img class="logo-img" src="https://souscription.harmony.ch/wp-content/uploads/logo-harmony.png" alt="Harmony Fitness" />
    </a>
    <a class="btn-primary" href="https://souscription.harmony.ch/" rel="noopener">
      S'inscrire
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none"><path d="M3 8 H13 M9 4 L13 8 L9 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</header>

<!-- ============ STAGE ============ -->
<div class="stage-wrap">
  <section class="stage">
    <div class="stage-bg"></div>
    <div class="stage-inner">
      <span class="eyebrow">Aucune offre en cours</span>
      <h1>On prépare<br/>la prochaine.</h1>
      <p class="stage-lead">
        Pas d'offre spéciale active pour l'instant. En attendant, retrouvez l'ensemble de nos <strong>abonnements standards</strong> et l'accès à nos <strong>9 clubs</strong> en Suisse romande.
      </p>
      <a class="stage-cta" href="https://souscription.harmony.ch/" rel="noopener">
        Voir les abonnements
        <span class="arrow">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none"><path d="M3 8 H13 M9 4 L13 8 L9 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>
      <span class="stage-meta">
        <span class="dot"></span>
        souscription.harmony.ch
      </span>
    </div>
  </section>
</div>

</body>
</html>
